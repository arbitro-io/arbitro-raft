[package]
name = "arbitro-raft"
version = "0.2.0"
edition = "2021"

[dependencies]
bytes = "1"
async-trait = "0.1"
tracing = "0.1"
zerocopy = { version = "0.8", features = ["derive"] }
futures = "0.3"
tokio = { version = "1", features = ["time", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
criterion = { version = "0.8.2", features = ["async_tokio"] }
socket2 = "0.5"

[target.'cfg(target_os = "linux")'.dev-dependencies]
tokio-uring = "0.5"

[[bench]]
name = "memory_e2e_bench"
harness = false

[[bench]]
name = "tcp_raft_bench"
harness = false

[[bench]]
name = "raft_transport_bench"
harness = false

[[bench]]
name = "dispatch_bench"
harness = false

[[bench]]
name = "election_bench"
harness = false
