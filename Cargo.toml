[package]
name = "arbitro-raft"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "Multi-Raft consensus engine (control-plane primitive) from the Arbitro ecosystem: leader election, log replication, joint-consensus membership, snapshots, and a pluggable transport."
repository = "https://github.com/arbitro-io/arbitro-raft"
readme = "README.md"

[lints.clippy]
# Subjective style lints that fire heavily across the test/bench/example
# harnesses (and nowhere in the shipped lib). `manual_async_fn` is deliberate:
# several transport futures return an explicit `impl Future + Send` to pin the
# Send bound; `type_complexity` flags the intentionally-explicit handle tuples.
manual_async_fn = "allow"
type_complexity = "allow"

[dependencies]
bytes = "1"
async-trait = "0.1"
tracing = "0.1"
zerocopy = { version = "0.8", features = ["derive"] }
futures = "0.3"
tokio = { version = "1", features = ["time", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
criterion = { version = "0.8.2", features = ["async_tokio"] }
socket2 = "0.5"
crc32fast = "1"

[target.'cfg(target_os = "linux")'.dev-dependencies]
tokio-uring = "0.5"

[[bench]]
name = "memory_e2e_bench"
harness = false

[[bench]]
name = "tcp_raft_bench"
harness = false

[[bench]]
name = "raft_transport_bench"
harness = false

[[bench]]
name = "dispatch_bench"
harness = false

[[bench]]
name = "election_bench"
harness = false
